<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meu Plano â€” Firebase</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#0c1422;color:#edf5fa}*{box-sizing:border-box}body{margin:0}.wrap{max-width:900px;margin:auto;padding:20px}.card{background:#182538;border:1px solid #34455d;border-radius:16px;padding:18px;margin:14px 0}input,button{font:inherit;border-radius:9px;padding:11px}input{width:100%;background:#101b2b;color:white;border:1px solid #52627a;margin:5px 0 10px}button{background:#28b48e;color:#05241b;font-weight:700;border:0;cursor:pointer;margin:4px}.secondary{background:#304158;color:white}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}.hidden{display:none}.muted{color:#b5c5d4}iframe{width:100%;height:82vh;border:0;border-radius:14px;background:#0c1422}#message{white-space:pre-wrap}.ok{color:#70edc6}.err{color:#ffb8b8}</style></head><body><main class="wrap"><h1>ðŸ¥— Meu Plano â€” NutriÃ§Ã£o</h1><div id="message"></div>
<section id="auth" class="card"><h2>Acesso individual</h2><label>Nome</label><input id="name" autocomplete="name" maxlength="100"><label>E-mail</label><input id="email" type="email" autocomplete="email"><label>Senha</label><input id="password" type="password" autocomplete="current-password" minlength="6"><div class="row"><button id="login">Entrar</button><button id="signup" class="secondary">Criar conta</button></div></section>
<section id="session" class="hidden"><div class="card row"><div><b id="who"></b><div id="sync" class="muted">Sincronizandoâ€¦</div></div><button id="logout" class="secondary">Sair</button></div><iframe id="app" title="Meu plano alimentar"></iframe></section></main>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js';
import{getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,updateProfile}from'https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js';
import{getFirestore,doc,setDoc,getDocs,collection,serverTimestamp}from'https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js';
const config={projectId:'meu-plano-nutricao',appId:'1:495550910645:web:a4746d874d31e714816efc',storageBucket:'meu-plano-nutricao.firebasestorage.app',apiKey:'AIzaSyDpNQlBt2JgooJcDNvJTT4NJVM8LA6Od_o',authDomain:'meu-plano-nutricao.firebaseapp.com',messagingSenderId:'495550910645'};
const auth=getAuth(initializeApp(config)),db=getFirestore(),$=id=>document.getElementById(id),KEY='meuplano-v1';let user=null,timer=null;
const message=(s,error=false)=>{$('message').textContent=s;$('message').className=error?'err':'ok'};
const isValidState=x=>x&&typeof x==='object'&&x.days&&typeof x.days==='object'&&x.measures&&typeof x.measures==='object';
const isDay=s=>/^\d{4}-\d{2}-\d{2}$/.test(s);
const TARGETS={rest:['Descanso',1172,130],normal:['Treino',1347,174],weights:['Treino',1347,174],cardio:['Cardio',1406,189],both:['Treino + cardio',1582,233]};
function patchFrame(){const w=$('app').contentWindow,d=w.document,select=d.getElementById('type'),ref=d.getElementById('reference');if(!select||!ref)return;select.querySelector('[value="normal"]')?.remove();const update=()=>{const t=TARGETS[select.value]||TARGETS.weights;ref.innerHTML='<p class="sub"><b>'+t[0]+':</b> '+t[1]+' kcal â€¢ '+t[2]+' g de carboidratos â€¢ 95 g de proteÃ­na â€¢ 30 g de gordura. <b>As refeiÃ§Ãµes-base sÃ£o ilustrativas e totalizam 1176,2 kcal, 143,1 g de carboidratos, 90,6 g de proteÃ­na e 26,3 g de gordura; valide antes de tratar como dieta definitiva.</b></p>'};select.addEventListener('change',()=>setTimeout(update));new MutationObserver(update).observe(ref,{childList:true,subtree:true});update()}
$('app').addEventListener('load',patchFrame);
async function ensureProfile(u){const display=(u.displayName||u.email.split('@')[0]).slice(0,100),createdAt=serverTimestamp();await Promise.all([
 setDoc(doc(db,'users',u.uid),{ownerId:u.uid,email:u.email,displayName:display,createdAt}),
 setDoc(doc(db,'directories',u.uid),{ownerId:u.uid,displayName:display,createdAt})]).catch(e=>{if(e.code!=='permission-denied')throw e})}
async function loadCloud(u){let state={days:{},measures:{}};const[logs,measures]=await Promise.all([getDocs(collection(db,'dailyLogs',u.uid,'entries')),getDocs(collection(db,'measurements',u.uid,'entries'))]);logs.forEach(x=>{try{let v=JSON.parse(x.data().payloadJson);if(isDay(x.id)&&v&&typeof v==='object')state.days[x.id]=v}catch{}});measures.forEach(x=>{let v=x.data();if(isDay(x.id))state.measures[x.id]={weight:v.weightKg,waist:v.waistCm}});localStorage.setItem(KEY,JSON.stringify(state))}
async function syncCloud(){if(!user)return;let state;try{state=JSON.parse(localStorage.getItem(KEY)||'{}')}catch{return}if(!isValidState(state))return;const writes=[];for(const[day,payload]of Object.entries(state.days)){if(!isDay(day))continue;let json=JSON.stringify(payload);if(json.length<=100000)writes.push(setDoc(doc(db,'dailyLogs',user.uid,'entries',day),{ownerId:user.uid,day,payloadJson:json,updatedAt:serverTimestamp()}))}for(const[day,m]of Object.entries(state.measures)){if(!isDay(day)||!m)continue;let w=Number(m.weight),c=m.waist==null?null:Number(m.waist);if(w>=20&&w<=400&&(c===null||c>=1&&c<=400))writes.push(setDoc(doc(db,'measurements',user.uid,'entries',day),{ownerId:user.uid,day,weightKg:w,waistCm:c,updatedAt:serverTimestamp()}))}await Promise.all(writes);$('sync').textContent='Sincronizado Â· '+new Date().toLocaleTimeString('pt-BR')}
window.addEventListener('storage',e=>{if(e.key===KEY&&user){clearTimeout(timer);timer=setTimeout(()=>syncCloud().catch(x=>message(x.message,true)),500)}});
$('login').onclick=()=>signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value).catch(e=>message(e.message,true));
$('signup').onclick=async()=>{try{const c=await createUserWithEmailAndPassword(auth,$('email').value.trim(),$('password').value);let n=$('name').value.trim().slice(0,100);if(n)await updateProfile(c.user,{displayName:n});await ensureProfile(c.user)}catch(e){message(e.message,true)}};
$('logout').onclick=()=>signOut(auth);
onAuthStateChanged(auth,async u=>{user=u;$('auth').classList.toggle('hidden',!!u);$('session').classList.toggle('hidden',!u);if(!u){$('app').removeAttribute('src');message('');return}try{await ensureProfile(u);await loadCloud(u);$('who').textContent=u.displayName||u.email;$('app').src='./index.html';$('sync').textContent='Dados carregados da sua conta';message('Acesso autorizado')}catch(e){message('Falha ao carregar: '+e.message,true)}});
</script></body></html>
